<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Muthukumar — Software Development Engineer</title>
    <meta
      name="description"
      content="Muthukumar is a Software Development Engineer building production-grade cloud-native systems with Golang, AWS, and Terraform — from microservice design to deployment and observability."
    />
    <meta
      name="keywords"
      content="Muthukumar, Software Development Engineer, Golang Developer, Backend Engineer, AWS, Terraform, React Developer, System Design, Full Stack Developer, Tamil Nadu"
    />
    <meta name="author" content="Muthukumar" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://muthu-kumar.in/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://muthu-kumar.in/" />
    <meta
      property="og:title"
      content="Muthukumar — Software Development Engineer"
    />
    <meta
      property="og:description"
      content="Building production-grade cloud-native systems with Golang, AWS, and Terraform — from microservice design to deployment and observability."
    />
    <meta property="og:image" content="https://muthu-kumar.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Muthukumar — Portfolio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://muthu-kumar.in/" />
    <meta
      name="twitter:title"
      content="Muthukumar — Software Development Engineer"
    />
    <meta
      name="twitter:description"
      content="Building production-grade cloud-native systems with Golang, AWS, and Terraform — from microservice design to deployment and observability."
    />
    <meta name="twitter:image" content="https://muthu-kumar.in/og-image.png" />

    <!-- Typography: precise grotesk + quiet editorial serif + technical mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const saved = localStorage.getItem("portfolio-theme");
        const preferred = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        const theme = saved || preferred;
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          theme === "dark" ? "#0b0b0e" : "#f4f2eb",
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
